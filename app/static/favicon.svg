<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle App Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav-bg)" />

  <!-- Rapid's Cheeky Ears: Left straight, Right bent -->
  <g fill="#FFFFFF">
    <!-- Left perky ear -->
    <path d="M 21 24 C 16 14, 15 4, 21 2 C 26 1, 28 10, 26 24 Z" />
    <path d="M 21 22 C 18 14, 18 6, 21 4 C 24 3, 25 10, 24 22 Z" fill="#F472B6" />

    <!-- Right folded ear (playful bend) -->
    <path d="M 37 24 C 42 16, 44 10, 48 10 C 50 14, 46 19, 41 24 Z" />
    <path d="M 46 10 C 50 12, 49 18, 43 20 Z" fill="#F472B6" />

    <!-- Sleek Bunny Head -->
    <circle cx="32" cy="27" r="14" fill="#FFFFFF" />

    <!-- Goggles on forehead -->
    <rect x="21" y="16" width="22" height="4" rx="2" fill="#4C1D95" />
    <circle cx="26" cy="18" r="4.5" fill="#F59E0B" />
    <circle cx="26" cy="18" r="3.2" fill="#C084FC" />
    <circle cx="38" cy="18" r="4.5" fill="#F59E0B" />
    <circle cx="38" cy="18" r="3.2" fill="#C084FC" />

    <!-- Cheeks Blush -->
    <circle cx="23" cy="30" r="2.2" fill="#FDA4AF" />
    <circle cx="41" cy="30" r="2.2" fill="#FDA4AF" />
    <!-- Mini lightning on left cheek -->
    <polygon points="21,29 23,29 22,32 24,32 20,36 21,33 20,33" fill="#F59E0B" />

    <!-- Left big anime eye -->
    <ellipse cx="27" cy="26" rx="2.5" ry="3" fill="#1E1B4B" />
    <circle cx="28" cy="25" r="1" fill="#FFFFFF" />

    <!-- Right PLAYFUL WINK 😉 -->
    <path d="M 35 27 Q 38 24 41 27" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Nose & Cheeky Smirk -->
    <polygon points="32,29 31,31 33,31" fill="#F43F5E" />
    <path d="M 31 32 Q 33 34 35 32" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <rect x="32" y="32" width="1.8" height="2" rx="0.5" fill="#FFFFFF" />
  </g>

  <!-- Rapid Holding The Golden Watch with Tilt -->
  <g transform="translate(0, 3) rotate(5 32 44)">
    <circle cx="32" cy="44" r="12" fill="url(#gold-grad)" stroke="#B45309" stroke-width="1" />
    <circle cx="32" cy="44" r="9.5" fill="#FAF5FF" />
    <!-- Clock Hands (10:10) -->
    <path d="M 32 44 L 28 40" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 32 44 L 37 38" stroke="#7C3AED" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="32" cy="44" r="1.5" fill="#F59E0B" />
    <!-- Left Paw on watch, Right Victory Sign -->
    <circle cx="21" cy="42" r="3" fill="#FFFFFF" />
    <!-- Right Victory paw ✌️ -->
    <circle cx="43" cy="41" r="2.8" fill="#FFFFFF" />
    <rect x="42" y="37" width="1.6" height="4" rx="0.8" fill="#FFFFFF" />
    <rect x="44" y="38" width="1.6" height="4" rx="0.8" fill="#FFFFFF" />
  </g>
</svg>