<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows & Dynamic Glow -->
    <filter id="mischief-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4C1D95" flood-opacity="0.25" />
    </filter>
    <filter id="goggle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.6" />
    </filter>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D97706" flood-opacity="0.35" />
    </filter>

    <!-- Gradients -->
    <!-- Bunny Fur (Crisp White to Soft Lavender Shadow) -->
    <linearGradient id="fur-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Playful Pink Inner Ear -->
    <linearGradient id="inner-ear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="60%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Aviator Goggles Strap & Metal Rim -->
    <linearGradient id="goggle-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Goggle Lenses (Glowing Violet Tech) -->
    <linearGradient id="goggle-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="40%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Pocket Watch Gold -->
    <linearGradient id="watch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Watch Dial Surface -->
    <linearGradient id="watch-dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="50%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Eye Pupil -->
    <linearGradient id="eye-pupil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="45%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>

  <!-- ── PLAYFUL SPEED LINES & SPARKLES ── -->
  <g opacity="0.75">
    <!-- Action speed arcs -->
    <path d="M 80 180 C 60 210, 60 260, 90 290" stroke="#C4B5FD" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 60 220 C 45 240, 45 270, 70 290" stroke="#DDD6FE" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Electric Hack Sparkles -->
    <path d="M 430 130 L 434 142 L 446 146 L 434 150 L 430 162 L 426 150 L 414 146 L 426 142 Z" fill="#F59E0B" />
    <path d="M 95 110 L 98 120 L 108 123 L 98 126 L 95 136 L 92 126 L 82 123 L 92 120 Z" fill="#8B5CF6" />
    <circle cx="445" cy="185" r="4" fill="#EC4899" />
    <circle cx="75" cy="160" r="3.5" fill="#FBBF24" />
  </g>

  <!-- ── MAIN MISCHIEVOUS CHARACTER & WATCH GROUP ── -->
  <g filter="url(#mischief-shadow)">
    <!-- 1. PLAYFUL ASYMMETRIC EARS (Tai cụp tai vểnh tinh nghịch) -->
    <!-- Left Ear: Straight, perky & alert -->
    <g transform="rotate(-18 190 120)">
      <path d="M 190 145 C 150 90, 140 15, 190 2 C 230 -8, 240 65, 220 145 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />
      <path d="M 192 130 C 165 85, 160 30, 192 16 C 215 8, 222 65, 210 130 Z" fill="url(#inner-ear)" opacity="0.9" />
    </g>

    <!-- Right Ear: Playfully BENT / FOLDED at the middle (Tai gập tinh quái) -->
    <g transform="translate(305, 50)">
      <!-- Lower ear section -->
      <path d="M 0 90 C 15 50, 35 25, 60 20 L 80 45 C 55 55, 30 85, 20 95 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />
      <path d="M 10 85 C 22 55, 38 35, 55 30 L 68 45 C 48 55, 28 80, 20 85 Z" fill="url(#inner-ear)" opacity="0.85" />
      <!-- Folded ear tip drooping playfully down-forward -->
      <path d="M 60 20 C 85 15, 105 35, 95 65 C 88 85, 65 80, 50 65 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />
      <path d="M 65 28 C 82 25, 95 40, 88 60 C 82 72, 68 70, 58 58 Z" fill="url(#inner-ear)" opacity="0.9" />
    </g>

    <!-- 2. TAIL & SLENDER AGILE BODY -->
    <!-- Tiny energetic fluffy tail on left -->
    <circle cx="150" cy="380" r="24" fill="url(#fur-body)" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="145" cy="375" r="12" fill="#FFFFFF" />

    <!-- Slender, agile body leaning over the watch (not round fat) -->
    <path d="M 195 260 C 180 310, 185 365, 210 395 C 235 425, 285 425, 310 395 C 330 365, 335 310, 320 260 Z" fill="url(#fur-body)" stroke="#CBD5E1" stroke-width="2" />

    <!-- Athletic Little Feet peeking from behind bottom of watch -->
    <ellipse cx="190" cy="450" rx="30" ry="18" transform="rotate(-20 190 450)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2" />
    <circle cx="188" cy="448" r="9" fill="#FDA4AF" opacity="0.7" />
    <ellipse cx="325" cy="450" rx="30" ry="18" transform="rotate(20 325 450)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2" />
    <circle cx="327" cy="448" r="9" fill="#FDA4AF" opacity="0.7" />

    <!-- 3. HEAD WITH DYNAMIC TILT (Đầu nghiêng tinh nghịch) -->
    <g transform="rotate(-6 256 195)">
      <!-- Head Base (Sleek heart-oval shape, fluffy cheeks) -->
      <path d="M 160 200 C 135 220, 138 245, 160 260 C 148 268, 155 280, 175 278 C 210 305, 302 305, 337 278 C 357 280, 364 268, 352 260 C 374 245, 377 220, 352 200 C 352 140, 160 140, 160 200 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />

      <!-- Cute Cheek Fluff Tufts -->
      <path d="M 142 235 L 126 245 L 145 252 L 132 262 L 158 262" stroke="#CBD5E1" stroke-width="2" fill="url(#fur-body)" />
      <path d="M 370 235 L 386 245 L 367 252 L 380 262 L 354 262" stroke="#CBD5E1" stroke-width="2" fill="url(#fur-body)" />

      <!-- Cheeks Blush & Cute Cheek Speed Mark -->
      <ellipse cx="180" cy="245" rx="16" ry="9" fill="#FDA4AF" opacity="0.65" />
      <ellipse cx="332" cy="245" rx="16" ry="9" fill="#FDA4AF" opacity="0.65" />
      <!-- Golden Speed Lightning Bolt on Left Cheek ⚡ -->
      <polygon points="172,238 178,238 174,248 181,248 168,260 171,250 166,250" fill="#F59E0B" />

      <!-- 4. STEAM PUNK / AVIATOR GOGGLES ON FOREHEAD (Cực ngầu & tinh quái) -->
      <g transform="translate(0, -10)">
        <!-- Goggle Brown/Violet Leather Strap -->
        <path d="M 155 172 Q 256 158, 357 172" stroke="#4C1D95" stroke-width="10" stroke-linecap="round" fill="none" />
        <path d="M 155 172 Q 256 158, 357 172" stroke="#6D28D9" stroke-width="6" stroke-linecap="round" fill="none" />

        <!-- Left Goggle Lens -->
        <circle cx="210" cy="165" r="26" fill="url(#watch-gold)" stroke="#78350F" stroke-width="2.5" />
        <circle cx="210" cy="165" r="21" fill="url(#goggle-lens)" filter="url(#goggle-glow)" />
        <path d="M 198 152 Q 212 148, 222 155" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />

        <!-- Middle Goggle Bridge -->
        <rect x="233" y="162" width="14" height="6" rx="2" fill="url(#watch-gold)" stroke="#78350F" stroke-width="1.5" />

        <!-- Right Goggle Lens -->
        <circle cx="270" cy="165" r="26" fill="url(#watch-gold)" stroke="#78350F" stroke-width="2.5" />
        <circle cx="270" cy="165" r="21" fill="url(#goggle-lens)" filter="url(#goggle-glow)" />
        <path d="M 258 152 Q 272 148, 282 155" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
      </g>

      <!-- 5. MISCHIEVOUS FACIAL EXPRESSION (Mắt nháy tinh quái, cười nhếch mép khoe răng thỏ) -->
      <!-- Left Eye: Big, Sparkling, Confident Violet Anime Eye -->
      <g transform="translate(195, 210)">
        <!-- Determined sly eyebrow -->
        <path d="M -16 -16 Q 6 -24, 26 -14" stroke="#312E81" stroke-width="4.5" stroke-linecap="round" fill="none" />
        <!-- Eye shape -->
        <ellipse cx="6" cy="6" rx="19" ry="24" fill="url(#eye-pupil)" />
        <!-- Big Catchlight Highlight Star -->
        <polygon points="12,-4 14,3 21,5 14,7 12,14 10,7 3,5 10,3" fill="#FFFFFF" />
        <circle cx="-2" cy="16" r="4.5" fill="#FFFFFF" />
        <circle cx="14" cy="17" r="3" fill="#A855F7" />
        <!-- Curved Eyelash -->
        <path d="M -14 0 Q 6 -10, 24 2" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" fill="none" />
      </g>

      <!-- Right Eye: PLAYFUL WINK 😉 (Nháy mắt tinh nghịch) -->
      <g transform="translate(305, 214)">
        <!-- Raised playful wink eyebrow -->
        <path d="M -22 -20 Q -2 -28, 18 -14" stroke="#312E81" stroke-width="4.5" stroke-linecap="round" fill="none" />
        <!-- Dynamic Cheeky Wink Arc (>) with eyelash flick -->
        <path d="M -16 6 Q 4 -6, 20 8" stroke="#1E1B4B" stroke-width="5" stroke-linecap="round" fill="none" />
        <path d="M 12 2 L 22 -6" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" />
        <!-- Little Sparkle at wink tip -->
        <polygon points="26,0 28,5 33,7 28,9 26,14 24,9 19,7 24,5" fill="#F59E0B" />
      </g>

      <!-- Little Cute Pink Nose -->
      <polygon points="256,234 249,242 263,242" fill="#F43F5E" />

      <!-- CHEEKY SMIRK & CUTE BUCK TOOTH (Cười khẩy tinh nghịch, thè răng thỏ cưng xỉu) -->
      <!-- Smirk mouth line curved to the right -->
      <path d="M 244 245 Q 252 250, 260 245 Q 275 240, 282 252" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Tiny Bunny Buck Tooth sticking out -->
      <rect x="254" y="247" width="8" height="9" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <!-- Tongue peeking out -->
      <path d="M 264 248 Q 272 260, 278 250 Z" fill="#FB7185" stroke="#E11D48" stroke-width="1.2" />
    </g>

    <!-- 6. THE GOLDEN POCKET WATCH HELD DYNAMICALLY (Nghiêng góc cá tính) -->
    <g transform="translate(256, 350) rotate(8)" filter="url(#gold-glow)">
      <!-- Top Crown Ring (Winder) -->
      <ellipse cx="0" cy="-78" rx="14" ry="9" fill="none" stroke="url(#watch-gold)" stroke-width="4.5" />
      <rect x="-8" y="-72" width="16" height="10" rx="2" fill="url(#watch-gold)" />

      <!-- Outer Heavy Gold Bezel -->
      <circle cx="0" cy="0" r="74" fill="url(#watch-gold)" stroke="#78350F" stroke-width="3" />
      <circle cx="0" cy="0" r="66" fill="#FFFBEB" />

      <!-- Watch Dial Face -->
      <circle cx="0" cy="0" r="62" fill="url(#watch-dial)" stroke="#DDD6FE" stroke-width="1.5" />

      <!-- Tech Speed Minute Hash Marks -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#C4B5FD" stroke-dasharray="2 6" stroke-width="2" />

      <!-- Main Hour Marks (12, 3, 6, 9) in Vibrant Violet -->
      <rect x="-2.5" y="-56" width="5" height="10" rx="2.5" fill="#7C3AED" />
      <rect x="-2.5" y="46" width="5" height="10" rx="2.5" fill="#7C3AED" />
      <rect x="46" y="-2.5" width="10" height="5" rx="2.5" fill="#7C3AED" />
      <rect x="-56" y="-2.5" width="10" height="5" rx="2.5" fill="#7C3AED" />

      <!-- Fast Neon Clock Hands pointing to 10:10 (Speed Victory) -->
      <!-- Hour Hand -->
      <path d="M 0 0 L -24 -24" stroke="#6D28D9" stroke-width="5" stroke-linecap="round" />
      <!-- Minute Hand -->
      <path d="M 0 0 L 32 -38" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" />
      <!-- Red Lightning Second Hand -->
      <path d="M 0 0 L 4 -25 L -2 -32 L 8 -52" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Center Gold Pivot Pin -->
      <circle cx="0" cy="0" r="6" fill="#F59E0B" stroke="#92400E" stroke-width="1.5" />

      <!-- Glass Glare Highlight -->
      <path d="M -40 -30 C -20 -50, 20 -50, 40 -30 C 20 -40, -20 -40, -40 -30 Z" fill="#FFFFFF" opacity="0.65" />
    </g>

    <!-- 7. PLAYFUL PAWS (Tay bám đồng hồ cực ngầu) -->
    <!-- Left Paw: Grabbing top edge of watch -->
    <g transform="translate(180, 310)">
      <ellipse cx="15" cy="15" rx="18" ry="14" transform="rotate(-15 15 15)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2" />
      <!-- Finger beans -->
      <circle cx="7" cy="12" r="3" fill="#FDA4AF" />
      <circle cx="15" cy="10" r="3" fill="#FDA4AF" />
      <circle cx="23" cy="12" r="3" fill="#FDA4AF" />
    </g>

    <!-- Right Paw: Peace Sign / Thumbs Up ✌️ (Tạo dáng tinh nghịch bên cạnh đồng hồ) -->
    <g transform="translate(325, 290)">
      <ellipse cx="20" cy="25" rx="16" ry="14" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2" />
      <!-- Two victory/rocker ears-fingers pointing up -->
      <rect x="12" y="-2" width="8" height="20" rx="4" transform="rotate(-12 16 8)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="1.8" />
      <rect x="23" y="2" width="8" height="18" rx="4" transform="rotate(10 27 11)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="1.8" />
      <circle cx="14" cy="4" r="2.5" fill="#FDA4AF" />
      <circle cx="27" cy="7" r="2.5" fill="#FDA4AF" />
    </g>
  </g>
</svg>
