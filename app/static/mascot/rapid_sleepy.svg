<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="sleep-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312E81" flood-opacity="0.2" />
    </filter>
    <linearGradient id="fur-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="inner-ear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="60%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="pillow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <linearGradient id="watch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Cozy Pastel Cloud & Zzz Bubbles -->
  <g opacity="0.85">
    <path d="M 80 430 Q 110 390 160 410 Q 220 370 290 400 Q 360 370 410 410 Q 460 430 430 460 Q 380 480 256 480 Q 130 480 80 430 Z" fill="url(#pillow-grad)" />

    <!-- Cute Zzz Typography -->
    <g transform="translate(350, 110)">
      <text x="0" y="0" font-family="'Fredoka', sans-serif" font-weight="900" font-size="28" fill="#818CF8">z</text>
      <text x="25" y="-20" font-family="'Fredoka', sans-serif" font-weight="900" font-size="36" fill="#6366F1">Z</text>
      <text x="55" y="-50" font-family="'Fredoka', sans-serif" font-weight="900" font-size="46" fill="#4F46E5">Z</text>
    </g>

    <!-- Tiny Moons & Sparkles -->
    <path d="M 100 130 A 20 20 0 0 0 125 155 A 16 16 0 1 1 100 130 Z" fill="#FBBF24" />
    <circle cx="150" cy="110" r="4" fill="#C4B5FD" />
  </g>

  <!-- Sleek Rapid Cuddled Up Sleeping With A Mischievous Smile -->
  <g filter="url(#sleep-shadow)">
    <!-- Drooped Soft Sleepy Ears -->
    <g transform="rotate(35 180 210)">
      <path d="M 180 210 C 130 220, 90 280, 140 310 C 180 320, 200 270, 190 210 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />
      <path d="M 175 225 C 140 235, 110 280, 145 298 C 170 305, 185 270, 180 225 Z" fill="url(#inner-ear)" opacity="0.85" />
    </g>
    <!-- Folded Ear resting flat -->
    <g transform="rotate(-25 330 200)">
      <path d="M 330 200 C 370 210, 410 270, 360 300 C 320 310, 305 260, 320 200 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />
      <path d="M 328 215 C 360 225, 385 270, 350 290 C 325 295, 315 260, 323 215 Z" fill="url(#inner-ear)" opacity="0.85" />
    </g>

    <!-- Slender Curled Body -->
    <ellipse cx="256" cy="370" rx="135" ry="95" fill="url(#fur-body)" stroke="#CBD5E1" stroke-width="2" />

    <!-- Head Resting Sideways Gently -->
    <g transform="rotate(-6 240 250)">
      <path d="M 160 200 C 135 220, 138 245, 160 260 C 148 268, 155 280, 175 278 C 210 305, 302 305, 337 278 C 357 280, 364 268, 352 260 C 374 245, 377 220, 352 200 C 352 140, 160 140, 160 200 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />

      <!-- Aviator Goggles Pushed Aside onto Head Tilted -->
      <g transform="translate(10, -25) rotate(12 250 170)">
        <path d="M 170 175 Q 256 165, 330 175" stroke="#4C1D95" stroke-width="8" stroke-linecap="round" fill="none" />
        <circle cx="215" cy="170" r="22" fill="#F59E0B" stroke="#78350F" stroke-width="2" />
        <circle cx="215" cy="170" r="17" fill="#C084FC" />
        <circle cx="265" cy="170" r="22" fill="#F59E0B" stroke="#78350F" stroke-width="2" />
        <circle cx="265" cy="170" r="17" fill="#C084FC" />
      </g>

      <!-- Soft Rosy Sleeping Blush & Cheek Lightning -->
      <ellipse cx="170" cy="270" rx="18" ry="10" fill="#FDA4AF" opacity="0.65" />
      <ellipse cx="305" cy="260" rx="16" ry="10" fill="#FDA4AF" opacity="0.5" />
      <polygon points="162,264 167,264 164,272 169,272 159,282 161,274 157,274" fill="#F59E0B" />

      <!-- Peaceful Dreaming Eyelashes -->
      <path d="M 170 245 Q 190 258 210 245" stroke="#312E81" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 270 238 Q 290 251 310 238" stroke="#312E81" stroke-width="4" stroke-linecap="round" fill="none" />

      <!-- Cute Tiny Nose & Dreaming Smirk With Buck Tooth -->
      <polygon points="238,260 232,267 244,267" fill="#F43F5E" />
      <path d="M 238 270 Q 248 278 260 272" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <rect x="245" y="271" width="6" height="7" rx="1.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    </g>

    <!-- Pocket Watch Resting Under Paws Like a Cozy Cushion -->
    <g transform="translate(190, 340)">
      <circle cx="65" cy="65" r="48" fill="url(#watch-gold)" stroke="#78350F" stroke-width="2" />
      <circle cx="65" cy="65" r="40" fill="#FAF5FF" />
      <!-- Hour/Minute hands in Sleep/Break pause mode -->
      <path d="M 65 65 L 65 42" stroke="#6366F1" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 65 65 L 85 65" stroke="#6366F1" stroke-width="3" stroke-linecap="round" />
      <circle cx="65" cy="65" r="4" fill="#F59E0B" />
      <!-- Paws Cuddling Watch -->
      <ellipse cx="25" cy="55" rx="16" ry="14" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="1.8" />
      <ellipse cx="95" cy="70" rx="16" ry="14" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="1.8" />
    </g>
  </g>
</svg>
