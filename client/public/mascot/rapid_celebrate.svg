<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="celeb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4C1D95" flood-opacity="0.25" />
    </filter>
    <linearGradient id="fur-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="inner-ear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="60%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="watch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="goggle-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
  </defs>

  <!-- Celebratory Confetti, Sparks & Speed Ribbons -->
  <g opacity="0.9">
    <rect x="70" y="70" width="16" height="6" rx="3" fill="#EC4899" transform="rotate(25 70 70)" />
    <rect x="420" y="60" width="16" height="6" rx="3" fill="#8B5CF6" transform="rotate(-35 420 60)" />
    <rect x="80" y="240" width="14" height="6" rx="3" fill="#10B981" transform="rotate(-15 80 240)" />
    <rect x="430" y="250" width="14" height="6" rx="3" fill="#F59E0B" transform="rotate(40 430 250)" />
    <circle cx="120" cy="50" r="6" fill="#FBBF24" />
    <circle cx="390" cy="45" r="7" fill="#60A5FA" />
    <circle cx="50" cy="150" r="5" fill="#A855F7" />
    <circle cx="460" cy="170" r="6" fill="#F43F5E" />
    <!-- Giant Golden Stars -->
    <path d="M 100 100 L 105 115 L 120 118 L 107 127 L 112 142 L 100 132 L 88 142 L 93 127 L 80 118 L 95 115 Z" fill="#F59E0B" />
    <path d="M 410 90 L 415 105 L 430 108 L 417 117 L 422 132 L 410 122 L 398 132 L 403 117 L 390 108 L 405 105 Z" fill="#F59E0B" />
  </g>

  <!-- Mischievous Rapid Jumping In Celebration -->
  <g filter="url(#celeb-shadow)">
    <!-- Ears: High Energy Asymmetric Bounce -->
    <g transform="rotate(-25 170 100)">
      <path d="M 170 140 C 130 80, 120 10, 170 2 C 205 -5, 220 50, 200 140 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />
      <path d="M 170 125 C 145 75, 140 25, 170 14 C 193 6, 203 50, 190 125 Z" fill="url(#inner-ear)" opacity="0.9" />
    </g>
    <!-- Right Ear folded playfully while bouncing -->
    <g transform="translate(320, 45)">
      <path d="M 0 85 C 20 45, 45 20, 70 15 L 90 40 C 65 50, 40 75, 20 90 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />
      <path d="M 70 15 C 95 10, 115 30, 105 58 C 98 75, 75 70, 60 58 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />
      <path d="M 75 22 C 92 20, 105 35, 98 52 C 90 64, 76 62, 68 50 Z" fill="url(#inner-ear)" opacity="0.9" />
    </g>

    <!-- Slender jumping body -->
    <path d="M 210 270 C 190 320, 195 365, 220 395 C 240 420, 280 420, 300 395 C 325 365, 330 320, 310 270 Z" fill="url(#fur-body)" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="160" cy="380" r="22" fill="url(#fur-body)" stroke="#CBD5E1" stroke-width="2" />

    <!-- Jumping Feet with Pink Pads -->
    <ellipse cx="180" cy="445" rx="32" ry="18" transform="rotate(-20 180 445)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2" />
    <circle cx="180" cy="442" r="10" fill="#FDA4AF" opacity="0.7" />
    <ellipse cx="335" cy="445" rx="32" ry="18" transform="rotate(20 335 445)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2" />
    <circle cx="335" cy="442" r="10" fill="#FDA4AF" opacity="0.7" />

    <!-- Head Tilted With Cheeky Joy -->
    <g transform="rotate(5 256 195)">
      <path d="M 160 200 C 135 220, 138 245, 160 260 C 148 268, 155 280, 175 278 C 210 305, 302 305, 337 278 C 357 280, 364 268, 352 260 C 374 245, 377 220, 352 200 C 352 140, 160 140, 160 200 Z" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2.5" />

      <!-- Goggles perched on forehead -->
      <path d="M 155 172 Q 256 158, 357 172" stroke="#4C1D95" stroke-width="10" stroke-linecap="round" fill="none" />
      <circle cx="210" cy="165" r="26" fill="url(#watch-gold)" stroke="#78350F" stroke-width="2.5" />
      <circle cx="210" cy="165" r="21" fill="url(#goggle-lens)" />
      <circle cx="270" cy="165" r="26" fill="url(#watch-gold)" stroke="#78350F" stroke-width="2.5" />
      <circle cx="270" cy="165" r="21" fill="url(#goggle-lens)" />

      <!-- Cheeks Blush & Lightning -->
      <ellipse cx="180" cy="245" rx="18" ry="10" fill="#FDA4AF" opacity="0.7" />
      <ellipse cx="332" cy="245" rx="18" ry="10" fill="#FDA4AF" opacity="0.7" />
      <polygon points="172,238 178,238 174,248 181,248 168,260 171,250 166,250" fill="#F59E0B" />

      <!-- Happy Mischievous Closed Eyes (^ ^) -->
      <path d="M 180 215 Q 200 188 220 215" stroke="#1E1B4B" stroke-width="5.5" stroke-linecap="round" fill="none" />
      <path d="M 295 215 Q 315 188 335 215" stroke="#1E1B4B" stroke-width="5.5" stroke-linecap="round" fill="none" />

      <!-- Pink Nose & Big Happy Laughing Mouth With Buck Tooth -->
      <polygon points="256,226 249,234 263,234" fill="#F43F5E" />
      <path d="M 242 236 Q 256 266 270 236 Z" fill="#E11D48" stroke="#881337" stroke-width="2.5" />
      <!-- Buck tooth -->
      <rect x="252" y="236" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
      <!-- Tongue -->
      <ellipse cx="256" cy="254" rx="7" ry="5" fill="#FDA4AF" />
    </g>

    <!-- Paws: Left Paw giving Victory sign ✌️ -->
    <g transform="translate(130, 230)">
      <ellipse cx="25" cy="35" rx="16" ry="14" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2" />
      <rect x="12" y="10" width="8" height="24" rx="4" transform="rotate(-15 16 22)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="1.8" />
      <rect x="24" y="12" width="8" height="22" rx="4" transform="rotate(8 28 23)" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="1.8" />
    </g>

    <!-- Right Paw Raising The Ringing Golden Pocket Watch -->
    <g transform="translate(290, 270)">
      <circle cx="65" cy="65" r="50" fill="url(#watch-gold)" stroke="#78350F" stroke-width="2.5" />
      <circle cx="65" cy="65" r="42" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.5" />
      <!-- Green checkmark -->
      <path d="M 50 65 L 60 75 L 80 53" stroke="#10B981" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Ringing waves -->
      <path d="M 122 50 C 132 60, 132 70, 122 80" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 130 42 C 144 57, 144 73, 130 88" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Paw grabbing watch -->
      <ellipse cx="25" cy="60" rx="16" ry="14" fill="url(#fur-body)" stroke="#94A3B8" stroke-width="2" />
    </g>
  </g>
</svg>
